version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cspr-mcp-server
    ports:
      - "${MCP_HTTP_PORT:-3001}:3001"
    environment:
      # Network Configuration
      - CASPER_NETWORK=${CASPER_NETWORK:?testnet}
      - CASPER_RPC_URL=${CASPER_RPC_URL:-https://node.testnet.casper.network/rpc}

      # MCP Transport (REQUIRED for cloud deployment)
      - MCP_TRANSPORT=${MCP_TRANSPORT:?http}
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:?3001}

      # CORS Origin (Coolify will auto-generate FQDN if needed)
      # Use SERVICE_FQDN_MCP for Coolify's auto-generated domain
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

      # Wallet Signing (REQUIRED - Mark as SECRET in Coolify UI)
      - CASPER_SECRET_KEY=${CASPER_SECRET_KEY:?}

      # Contract Addresses (Deployed on Testnet)
      - CASPER_TOKEN_CONTRACT_ADDRESS=${CASPER_TOKEN_CONTRACT_ADDRESS:-contract-package-b481b1e86bc2a1c5d73d5e108c6246ad0358889acc9ef0f429bd4cb454a3bc05}
      - CASPER_NFT_CONTRACT_ADDRESS=${CASPER_NFT_CONTRACT_ADDRESS:-contract-package-195b64a1cca143d9361790af34ef79d3094bb00094330c1ccc1cd4987c0b583b}
      - CASPER_DAO_CONTRACT_ADDRESS=${CASPER_DAO_CONTRACT_ADDRESS:-contract-package-91083a42df41a577f2d5695ad4c78f799dc1d3016eccef4ce2a6f9a43c68506f}
      - CASPER_DEX_CONTRACT_ADDRESS=${CASPER_DEX_CONTRACT_ADDRESS:-contract-package-7f09f5c808f2a3a684d70cfe49cec2c6b90c11aa1d8053046d91fd26a342bca1}

      # Optional: API Keys (Mark as SECRET in Coolify UI)
      - CSPR_CLOUD_API_KEY=${CSPR_CLOUD_API_KEY:-}

      # Coolify Magic Variables (auto-generated by Coolify)
      # Uncomment if you want Coolify to manage your domain
      # - SERVICE_FQDN_MCP_3001=/
      # This will give you: https://mcp-<random>.yourdomain.com

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# Networks (Coolify manages this automatically)
networks:
  default:
    name: cspr-mcp-network
